services:
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: telemetry_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  neo4j:
    image: neo4j:5.18-community
    container_name: telemetry_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telemetry_api
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - NEO4J_URI=bolt://neo4j:7687
    volumes:
      - ./data:/app/data
    depends_on:
      - qdrant
      - neo4j
    restart: on-failure

volumes:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins: